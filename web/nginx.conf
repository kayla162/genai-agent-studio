# live 版：提供 next build 的靜態輸出（out/），/api、/files、/ws、/docs 轉給 FastAPI
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 每次請求才解析 api 的位址：api 容器重建後 IP 改變也不必重啟 nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # 商品照與品牌手冊上傳（api 限制 20 MB）
    client_max_body_size 25m;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上傳品牌文件的串流：api 在 120 秒沒有進度時回報逾時（INGEST_IDLE_TIMEOUT）。proxy_read_timeout 同樣是
        # 兩次讀取之間的間隔，要比 api 久，api 自己的逾時訊息才傳得到瀏覽器
        proxy_read_timeout 150s;
    }

    location /files/ {
        proxy_pass $api;
        proxy_http_version 1.1;
    }

    # 任務事件：生圖時事件可能隔比較久，連線最長保持 1 小時（前端斷線後也會自動重新連線）
    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # FastAPI 自動產生的 API 文件
    location = /docs {
        proxy_pass $api;
    }

    location = /openapi.json {
        proxy_pass $api;
    }

    # 建置檔名含雜湊，可以長期快取
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /studio → studio.html。HTML 與 RSC 的 .txt 檔名固定，每次重新建置後都要重新驗證
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
