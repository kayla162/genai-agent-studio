# live 模式 E2E 專用（web 的 npm run e2e:live 會自動啟動與移除）：
#   docker compose -p genai-agent-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
# 獨立的專案名稱與 volume，不影響平常使用的資料庫、向量庫、上傳檔與商品照；只開放 web（127.0.0.1:3200）。
x-e2e-backend: &e2e-backend
  environment:
    SIM_SPEED: '1'
    SIM_FIRST_ROUND_FAIL: 'true'
    SIM_FORCE_ALL_FAIL: 'false'
    # 模擬去背：不下載約 1 GB 的模型
    CUTOUT_MODEL: sim
    # 模擬檢索：不下載約 1.2 GB 的 RAG 模型，也不寫入 Chroma
    RAG_MODE: sim
    # 真正的審查：composer 繪製審查用海報（不受 .env 的 REVIEW_MODE 影響）
    REVIEW_MODE: composer
    # 模擬 Agent 與 VLM，不呼叫 Gemini；開發者 .env 裡的 key 也不會進到 E2E 的容器
    AGENT_MODE: sim
    GEMINI_API_KEY: ''
  volumes: !override
    - ./brands:/app/brands:ro
    - e2e-photos:/app/assets/products:ro
    - e2e-data:/app/data
    - ./pricing.yaml:/app/pricing.yaml:ro

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  chroma:
    ports: !reset []
    volumes: !override ['e2e-chroma:/data']
  api:
    <<: *e2e-backend
    ports: !reset []
  worker:
    <<: *e2e-backend
  web:
    ports: !override ['127.0.0.1:3200:80']

volumes:
  e2e-data:
  e2e-photos:
  e2e-chroma:
