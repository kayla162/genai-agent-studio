[project]
name = "genai-agent-backend"
version = "0.1.0"
description = "虛實整合 GenAI Agent 後端：FastAPI、SAQ worker 與外部服務轉接器"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "saq>=0.26.4",
    "sqlalchemy[asyncio]>=2.1.3",
    "tokenizers>=0.23.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "onnx>=1.23.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.29.20261017",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# SAQ 0.26 在 redis-py 8 上呼叫已棄用的 setex
filterwarnings = ["ignore:Call to deprecated setex:DeprecationWarning"]
markers = ["model: 需要真正的模型檔（models/；去背另外需要 CUTOUT_TEST_PHOTO 指定的照片），沒有時略過"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# onnxruntime 沒有附型別資訊
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
