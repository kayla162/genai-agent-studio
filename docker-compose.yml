# 虛實整合 GenAI Agent：本機執行（所有連接埠只綁定 127.0.0.1）。ComfyUI 在 Windows 另外啟動（見 comfyui/README.md）。
# 映像檔取自 AWS 的 Docker 官方映像鏡像（public.ecr.aws/docker/library），不需要登入 Docker Hub。
#
#   docker compose up -d --build     整套服務：瀏覽器開 http://127.0.0.1:3000
#   docker compose up -d postgres redis chroma   只開資料庫、佇列與向量庫（在本機用 uv、npm 開發與測試）
name: genai-agent

# api 與 worker 共用：同一個映像檔，設定來自 .env（可省略）；容器之間的位址與容器內的路徑固定在這裡
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://genai:genai@postgres:5432/genai
    REDIS_URL: redis://redis:6379/0
    COMPOSER_URL: http://composer:3900
    CHROMA_URL: http://chroma:8000
    BRANDS_DIR: /app/brands
    DATA_DIR: /app/data
    LOCAL_PHOTOS_DIR: /app/assets/products
    MODELS_DIR: /app/models
    # 審查：composer（預設，composer 繪製審查用海報存到 data/jobs/，量出主色後審查）或 sim（不畫圖，模擬審查）。
    # 可在 .env 或環境變數設定 REVIEW_MODE；api（系統狀態）與 worker 一定讀到同一個值
    REVIEW_MODE: ${REVIEW_MODE:-composer}
    # Agent 與 VLM：gemini（預設，需要 .env 的 GEMINI_API_KEY 與 REVIEW_MODE=composer）或 sim（模擬，不需要 key）。
    # api（需求拆解、系統狀態）與 worker 一定讀到同一個值；其他 GEMINI_* 由 .env 傳入
    AGENT_MODE: ${AGENT_MODE:-gemini}
    # Gemini 單價表（repo 根目錄的 pricing.yaml，唯讀掛載）
    PRICING_FILE: /app/pricing.yaml
    # 生圖：comfyui（預設，ComfyUI 在 Windows 啟動，需要 REVIEW_MODE=composer）或 sim（程序化背景，不需要 GPU）。
    # api（系統狀態）與 worker 一定讀到同一個值；其他 COMFYUI_* 與 MEMORY_LOCK 由 .env 傳入
    IMAGE_MODE: ${IMAGE_MODE:-comfyui}
    # 容器內以 host.docker.internal 連到 Windows 上的 ComfyUI
    COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    # ComfyUI 的 workflow 與參數對照表（repo 的 comfyui/workflows，唯讀掛載）
    COMFYUI_WORKFLOWS_DIR: /app/comfyui/workflows
    # 容器之間以 http://api:8000 呼叫（n8n 不經過 nginx）：Host 為 api 也要接受（.env 自訂 ALLOWED_HOSTS 時要保留 "api"）。
    # PUBLIC_HOST（Cloudflare Tunnel 的網域）也要接受；.env 自訂 ALLOWED_HOSTS 時要自己加上
    ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["127.0.0.1", "localhost", "api", "${PUBLIC_HOST:-localhost}"]}'
  # Docker Desktop 內建 host.docker.internal；Linux 的 Docker 要加上這一行
  extra_hosts: ['host.docker.internal:host-gateway']
  volumes:
    - ./brands:/app/brands:ro
    - ./assets/products:/app/assets/products:ro
    - ./data:/app/data
    - ./pricing.yaml:/app/pricing.yaml:ro
    - ./comfyui/workflows:/app/comfyui/workflows:ro
  restart: unless-stopped

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai
      POSTGRES_DB: genai
    # 5433：避免和 Windows 上原生安裝的 PostgreSQL（5432）衝突；容器之間仍用 postgres:5432
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genai -d genai']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: public.ecr.aws/docker/library/redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # RAG 向量庫：每個品牌一個 collection。資料以 PostgreSQL 為準，volume 遺失時 worker 會自動重建
  chroma:
    image: ghcr.io/chroma-core/chroma:1.5.9
    # 8001：8000 已給 api；本機開發與測試連 127.0.0.1:8001，容器之間仍用 chroma:8000
    ports: ['127.0.0.1:8001:8000']
    volumes: ['chroma:/data']
    healthcheck:
      # 映像檔裡沒有 curl：以 bash 的 /dev/tcp 讀 heartbeat
      test: ['CMD', 'bash', '-c', "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # 版型、審查用海報的繪製、規則審查與模擬邏輯（直接執行 web/src/lib 的 TypeScript）；只給 api 與 worker 使用，不對外開放。
  # 海報字型（Noto Sans／Serif TC，約 29 MB）在建置時下載並核對 SHA-256（web/Dockerfile 的 fonts 階段），不需要掛載資料夾
  composer:
    build:
      context: ./web
      target: composer
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3900/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # REST、WebSocket 與檔案；啟動時執行 migration 並匯入品牌設定檔
  api:
    <<: *backend
    command: ['uvicorn', 'app.api.main:app', '--host', '0.0.0.0', '--port', '8000']
    # 8000：API 文件（/docs），以及 next dev 以 API_PROXY_URL 連線
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      composer: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30

  # 生圖任務、文件上傳、去背與回寫；等 api 完成 migration、chroma 健康後才啟動
  worker:
    <<: *backend
    command: ['python', '-m', 'app.worker']
    # 這份 volumes 會取代 x-backend 的 volumes（不是合併），所以兩處的掛載要一起修改
    volumes:
      - ./brands:/app/brands:ro
      - ./assets/products:/app/assets/products:ro
      - ./data:/app/data
      - ./pricing.yaml:/app/pricing.yaml:ro
      - ./comfyui/workflows:/app/comfyui/workflows:ro
      # 去背模型（BiRefNet，約 1 GB）與 RAG 模型（BGE-M3＋Reranker，約 1.2 GB）：第一次啟動時下載
      - models:/app/models
    depends_on:
      api: { condition: service_healthy }
      chroma: { condition: service_healthy }

  # live 版前端：nginx 提供靜態輸出，/api、/files、/ws、/docs 轉給 api
  web:
    build:
      context: ./web
      target: web
    # nginx 以非 root 執行，聽容器內的 8080
    ports: ['127.0.0.1:3000:8080']
    environment:
      # Cloudflare Tunnel 的網域：nginx 的 server_name 多接受這個名稱（見 docs/tunnel.md）
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # 建立 n8n 的資料庫（已經初始化過的 postgres volume 不會再跑初始化腳本，所以每次啟動時檢查）
  n8n-db:
    profiles: [automation]
    image: public.ecr.aws/docker/library/postgres:18-alpine
    environment:
      PGPASSWORD: genai
    command:
      - sh
      - -c
      - psql -h postgres -U genai -d genai -tAc "SELECT 1 FROM pg_database WHERE datname = 'n8n'" | grep -q 1 || psql -h postgres -U genai -d genai -c 'CREATE DATABASE n8n'
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # n8n：試算表批次產圖與 LINE 審核（docker compose --profile automation up -d）。只綁 127.0.0.1:5678；
  # 第一次啟動時匯入 n8n/workflows/，之後的更新見 n8n/README.md。映像檔內建 node 使用者（非 root）
  n8n:
    profiles: [automation]
    image: docker.n8n.io/n8nio/n8n:2.46.6
    ports: ['127.0.0.1:5678:5678']
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: genai
      DB_POSTGRESDB_PASSWORD: genai
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: Asia/Taipei
      TZ: Asia/Taipei
      # 審核表單與 webhook 的對外網址（LINE 訊息裡的表單連結）；經 Cloudflare Tunnel 開啟時設定 N8N_PUBLIC_URL
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://127.0.0.1:5678/}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Code 節點驗簽要用 crypto；工作流以 $env 讀下面的變數
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      AUTOMATION_API_URL: http://api:8000
      AUTOMATION_TOKEN: ${AUTOMATION_TOKEN:-}
      JOB_WEBHOOK_SECRET: ${JOB_WEBHOOK_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_TO: ${LINE_TO:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
    # 取代映像檔原本的 entrypoint（tini）：init 讓 Docker 補上 PID 1 的訊號轉送與回收子程序（task runner）
    init: true
    entrypoint: ['sh', '-c']
    # 三個必填變數在啟動時才檢查：compose 的「必填變數」語法在解析整份檔案時就檢查，沒有用 automation profile 也會無法啟動
    command:
      - >-
        [ -n "$$N8N_ENCRYPTION_KEY" ] && [ -n "$$AUTOMATION_TOKEN" ] && [ -n "$$JOB_WEBHOOK_SECRET" ]
        || { echo '請在 .env 設定 N8N_ENCRYPTION_KEY、AUTOMATION_TOKEN 與 JOB_WEBHOOK_SECRET（見 n8n/README.md）' >&2; exit 1; };
        [ -f /home/node/.n8n/.imported ]
        || (n8n import:workflow --separate --input=/workflows && touch /home/node/.n8n/.imported);
        exec n8n start
    volumes:
      - ./n8n/workflows:/workflows:ro
      - n8n:/home/node/.n8n
    depends_on:
      n8n-db: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    restart: unless-stopped

  # Cloudflare Tunnel：手機在外面也能開 Studio 與審核表單（docker compose --profile tunnel up -d）。
  # 不開任何對外的埠：cloudflared 主動連到 Cloudflare。網域與 Cloudflare Access 在 Cloudflare 的介面設定（docs/tunnel.md）
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.3
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  postgres:
  redis:
  models:
  chroma:
  n8n:
